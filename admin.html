<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 康艺省钱家具超市</title>
<style>
  :root{--red:#c62828;--ink:#2b2b2b;--muted:#888;--line:#ece7e0;--bg:#f6f3ee;--card:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.5;}
  a{color:var(--red);}
  .top{background:var(--red);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .top h1{font-size:16px;}
  .top .sub{font-size:11px;opacity:.85;}
  .top-actions{display:flex;gap:8px;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#eee;color:#444;}
  .btn.primary{background:var(--red);color:#fff;}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .wrap{max-width:860px;margin:0 auto;padding:14px 16px 40px;}
  .panel{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(70,40,20,.07);padding:16px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{padding:8px 18px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:14px;cursor:pointer;}
  .tab.active{background:var(--red);color:#fff;border-color:var(--red);}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:12px 0;}
  .bar .hint{font-size:12px;color:var(--muted);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:#666;margin-bottom:5px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;}
  .field textarea{min-height:70px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;}
  td img{width:54px;height:40px;object-fit:cover;border-radius:6px;background:#eee;}
  .price{color:var(--red);font-weight:700;white-space:nowrap;}
  .ops{white-space:nowrap;}
  .ops button{margin-right:4px;}
  .muted{color:var(--muted);font-size:12px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .modal.open{display:flex;}
  .modal-panel{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px 16px 24px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h2{font-size:17px;}
  .x{border:none;background:#f0ece5;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
  .img-preview{width:100%;height:150px;object-fit:contain;background:#f3efe8;border-radius:8px;margin-top:8px;display:none;}
  .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;}
  .toast.show{opacity:1;}
  .login{max-width:360px;margin:15vh auto 0;padding:30px 26px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.1);}
  .login h1{font-size:18px;margin-bottom:4px;}
  .login .sub{color:var(--muted);font-size:12px;margin-bottom:18px;}
  .hidden{display:none !important;}
  .drag-cell{width:30px;text-align:center;padding:0 2px;}
  .drag-handle{cursor:grab;color:#bbb;font-size:15px;letter-spacing:-1px;user-select:none;touch-action:none;display:inline-block;padding:4px 2px;}
  .drag-handle:active{cursor:grabbing;color:#999;}
  .sort-ghost{opacity:.35;background:#ffe3e3;}
</style>
</head>
<body>
  <div class="top">
    <div><h1>康艺省钱家具超市 · 管理后台</h1><div class="sub">河源店</div></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnLogout" style="display:none">退出</button>
      <a class="btn ghost" href="/" target="_blank">看画册</a>
    </div>
  </div>

  <div class="wrap">
    <!-- login -->
    <div class="login" id="loginBox">
      <h1>管理员登录</h1>
      <div class="sub">请输入后台管理密码</div>
      <div class="field">
        <label>管理密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码">
      </div>
      <button class="btn primary" style="width:100%" id="btnLogin">登 录</button>
      <p class="muted" style="margin-top:12px">初始密码：123456（登录后请在“门店设置”中修改）</p>
    </div>

    <!-- main -->
    <div id="mainBox" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="products">产品管理</button>
        <button class="tab" data-tab="settings">门店设置</button>
      </div>

      <section id="tab-products">
        <div class="bar">
          <button class="btn primary" id="btnAdd">＋ 新增产品</button>
          <span class="hint" id="countHint"></span>
        </div>
        <div class="panel" style="overflow-x:auto">
          <table>
            <thead><tr><th></th><th>图</th><th>名称 / 型号</th><th>分类</th><th>规格</th><th>一口价</th><th>操作</th></tr></thead>
            <tbody id="prodRows"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-settings" class="hidden">
        <div class="panel">
          <div class="field"><label>店名</label><input id="s_storeName"></div>
          <div class="field"><label>宣传语（slogan）</label><input id="s_slogan"></div>
          <div class="row2">
            <div class="field"><label>营业时间</label><input id="s_hours" placeholder="09:00 - 21:00"></div>
            <div class="field"><label>联系电话</label><input id="s_phone" placeholder="如 0762-8888888"></div>
          </div>
          <div class="field"><label>门店地址</label><textarea id="s_address"></textarea></div>
          <div class="row2">
            <div class="field"><label>微信号（选填）</label><input id="s_wechat"></div>
            <div class="field"><label>温馨提示（选填）</label><input id="s_notice"></div>
          </div>
          <div class="field"><label>核心卖点（每行一个）</label><textarea id="s_values"></textarea></div>
          <div class="field"><label>分类顺序（每行一个，决定画册分类栏顺序）</label><textarea id="s_catorder"></textarea></div>
          <button class="btn primary" id="btnSaveSettings">保存门店设置</button>
          <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
          <div class="field"><label>修改管理密码</label>
            <div class="row2">
              <input type="password" id="p_old" placeholder="原密码">
              <input type="password" id="p_new" placeholder="新密码（至少4位）">
            </div>
          </div>
          <button class="btn" id="btnChangePass">修改密码</button>
        </div>
      </section>
    </div>
  </div>

  <!-- product modal -->
  <div class="modal" id="prodModal">
    <div class="modal-panel">
      <div class="modal-head"><h2 id="pmTitle">新增产品</h2><button class="x" id="pmClose">×</button></div>
      <div class="row2">
        <div class="field"><label>产品名称 *</label><input id="pm_name"></div>
        <div class="field"><label>分类</label><input id="pm_category" list="catList" placeholder="如 沙发"><datalist id="catList"></datalist></div>
      </div>
      <div class="row2">
        <div class="field"><label>型号</label><input id="pm_model" placeholder="如 KY-1001"></div>
        <div class="field"><label>一口价 *（元）</label><input id="pm_price" inputmode="numeric" placeholder="如 2580"></div>
      </div>
      <div class="field"><label>规格</label><input id="pm_spec" placeholder="如 3人位 + 贵妃位"></div>
      <div class="field"><label>外径尺寸</label><input id="pm_dimensions" placeholder="如 长280 × 深90 × 高85 cm"></div>
      <div class="field"><label>材质</label><input id="pm_material" placeholder="如 科技布 + 高密度海绵 + 实木框架"></div>
      <div class="field"><label>产品图</label>
        <input id="pm_image" placeholder="图片链接，或点击下方上传图片">
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button class="btn small" id="btnUpload">上传图片</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <span class="muted">支持 png / jpg / gif / webp / svg</span>
        </div>
        <img class="img-preview" id="pm_preview" alt="预览">
      </div>
      <div class="field" style="display:flex;gap:16px">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pm_featured"> 推荐置顶</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pm_onSale" checked> 在售</label>
      </div>
      <button class="btn primary" style="width:100%" id="pmSave">保存产品</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/sortable.min.js?v=20260925"></script>
  <script src="/js/admin.js?v=20260925"></script>
</body>
</html>
