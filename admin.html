<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 康艺省钱家具超市</title>
<style>
  :root{--red:#c62828;--ink:#2b2b2b;--muted:#888;--line:#ece7e0;--bg:#f6f3ee;--card:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.5;}
  a{color:var(--red);}
  .top{background:var(--red);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .top h1{font-size:16px;}
  .top .sub{font-size:11px;opacity:.85;}
  .top-actions{display:flex;gap:8px;}
  .btn{border:none;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;background:#f0ece5;color:#444;transition:transform .1s,opacity .15s;}
  .btn.primary{background:linear-gradient(135deg,#e33b3b,#c62828);color:#fff;box-shadow:0 2px 8px rgba(198,40,40,.25);}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.55);}
  .btn.small{padding:5px 11px;font-size:12px;border-radius:16px;}
  .btn:active{transform:scale(.96);opacity:.92;}
  .wrap{max-width:860px;margin:0 auto;padding:14px 16px 40px;}
  .panel{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(70,40,20,.07);padding:16px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{padding:8px 18px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:14px;cursor:pointer;}
  .tab.active{background:var(--red);color:#fff;border-color:var(--red);}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:12px 0;}
  .bar .hint{font-size:12px;color:var(--muted);}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;color:#666;margin-bottom:5px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;}
  .field textarea{min-height:70px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;}
  td img{width:54px;height:40px;object-fit:cover;border-radius:6px;background:#eee;}
  .price{color:var(--red);font-weight:700;white-space:nowrap;}
  .ops{white-space:nowrap;}
  .ops button{margin-right:4px;}
  .muted{color:var(--muted);font-size:12px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .modal.open{display:flex;}
  .modal-panel{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px 16px 24px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h2{font-size:17px;}
  .x{border:none;background:#f0ece5;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;}
  .img-preview{width:100%;height:150px;object-fit:contain;background:#f3efe8;border-radius:8px;margin-top:8px;display:none;}
  .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;}
  .toast.show{opacity:1;}
  .login{max-width:360px;margin:15vh auto 0;padding:30px 26px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.1);}
  .login h1{font-size:18px;margin-bottom:4px;}
  .login .sub{color:var(--muted);font-size:12px;margin-bottom:18px;}
  .hidden{display:none !important;}
  .cropbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;flex-direction:column;}
  .cropbox.open{display:flex;}
  .crop-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;color:#fff;flex:none;}
  .crop-title{font-size:13px;opacity:.9;}
  .crop-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px;}
  .crop-holder{position:relative;display:inline-block;line-height:0;cursor:crosshair;touch-action:none;}
  #cropImg{max-width:92vw;max-height:74vh;display:block;}
  .crop-sel{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;}
  #lbCrop{padding:0 16px;width:auto;border-radius:21px;font-size:14px;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;display:none;}
  .lightbox.open{display:block;}
  .lb-close{position:fixed;right:16px;top:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;}
  .lb-tools{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:3;}
  .lb-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;font-weight:700;border:none;cursor:pointer;}
  .lb-wrap{position:absolute;inset:0;overflow:auto;}
  .lb-inner{display:flex;align-items:center;justify-content:center;min-width:100%;min-height:100%;}
  #lbImg{max-width:92vw;max-height:92vh;transition:max-width .2s,max-height .2s;}
  .img-view{cursor:zoom-in;}
  #filterCat{appearance:none;-webkit-appearance:none;border:1px solid #e7c6c6;border-radius:20px;padding:8px 38px 8px 16px;font-size:13px;font-weight:600;background:#fdf4f4 url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 10l5 5 5-5z' fill='%23c48080'/%3E%3C/svg%3E") no-repeat right 12px center;background-size:14px;color:#a85555;cursor:pointer;box-shadow:0 2px 8px rgba(198,40,40,.07);outline:none;transition:border-color .15s,box-shadow .15s;}
  #filterCat:hover{border-color:#dba9a9;}
  #filterCat:focus{border-color:#c97f7f;box-shadow:0 0 0 3px rgba(198,40,40,.10);}
  .img-list{display:flex;flex-wrap:wrap;gap:8px;}
  .img-item{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f3efe8;}
  .img-item img{width:100%;height:100%;object-fit:cover;}
  .img-item .img-cover{position:absolute;left:0;right:0;bottom:0;background:rgba(198,40,40,.9);color:#fff;font-size:10px;text-align:center;padding:1px 0;}
  .img-item .img-del{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer;border:none;}
  .img-item .img-up{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;text-align:center;cursor:pointer;border:none;}
  .drag-cell{width:30px;text-align:center;padding:0 2px;}
  .drag-handle{cursor:grab;color:#bbb;font-size:15px;letter-spacing:-1px;user-select:none;touch-action:none;display:inline-block;padding:4px 2px;}
  .drag-handle:active{cursor:grabbing;color:#999;}
  .sort-ghost{opacity:.35;background:#ffe3e3;}
</style>
</head>
<body>
  <div class="top">
    <div><h1>康艺省钱家具超市 · 管理后台</h1><div class="sub">河源店</div></div>
    <div class="top-actions">
      <button class="btn ghost" id="btnLogout" style="display:none">退出</button>
      <a class="btn ghost" href="/" target="_blank">看画册</a>
    </div>
  </div>

  <div class="wrap">
    <!-- login -->
    <div class="login" id="loginBox">
      <h1>管理员登录</h1>
      <div class="sub">请输入后台管理密码</div>
      <div class="field">
        <label>管理密码</label>
        <input type="password" id="loginPass" placeholder="请输入密码">
      </div>
      <button class="btn primary" style="width:100%" id="btnLogin">登 录</button>
      <p class="muted" style="margin-top:12px">初始密码：123456（登录后请在“门店设置”中修改）</p>
    </div>

    <!-- main -->
    <div id="mainBox" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="products">产品管理</button>
        <button class="tab" data-tab="settings">门店设置</button>
      </div>

      <section id="tab-products">
        <div class="bar">
          <button class="btn primary" id="btnAdd">＋ 新增产品</button>
          <button class="btn" id="btnBatch">批量添加</button>
          <select id="filterCat"><option value="">全部分类</option></select>
          <span class="hint" id="countHint"></span>
        </div>
        <div class="panel" style="overflow-x:auto">
          <table>
            <thead><tr><th></th><th>图</th><th>名称 / 型号</th><th>分类</th><th>规格</th><th>一口价</th><th>操作</th></tr></thead>
            <tbody id="prodRows"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-settings" class="hidden">
        <div class="panel">
          <div class="field"><label>店名</label><input id="s_storeName"></div>
          <div class="field"><label>宣传语（slogan）</label><input id="s_slogan"></div>
          <div class="row2">
            <div class="field"><label>营业时间</label><input id="s_hours" placeholder="09:00 - 21:00"></div>
            <div class="field"><label>联系电话</label><input id="s_phone" placeholder="如 0762-8888888"></div>
          </div>
          <div class="field"><label>门店地址</label><textarea id="s_address"></textarea></div>
          <div class="row2">
            <div class="field"><label>微信号（选填）</label><input id="s_wechat"></div>
            <div class="field"><label>温馨提示（选填）</label><input id="s_notice"></div>
          </div>
          <div class="field"><label>核心卖点（每行一个）</label><textarea id="s_values"></textarea></div>
          <div class="field"><label>分类顺序（每行一个，决定画册分类栏顺序）</label><textarea id="s_catorder"></textarea></div>
          <button class="btn primary" id="btnSaveSettings">保存门店设置</button>
          <hr style="border:none;border-top:1px solid var(--line);margin:18px 0">
          <div class="field"><label>修改管理密码</label>
            <div class="row2">
              <input type="password" id="p_old" placeholder="原密码">
              <input type="password" id="p_new" placeholder="新密码（至少4位）">
            </div>
          </div>
          <button class="btn" id="btnChangePass">修改密码</button>
        </div>
      </section>
    </div>
  </div>

  <!-- product modal -->
  <div class="modal" id="prodModal">
    <div class="modal-panel">
      <div class="modal-head"><h2 id="pmTitle">新增产品</h2><button class="x" id="pmClose">×</button></div>
      <div class="row2">
        <div class="field"><label>产品名称 *</label><input id="pm_name"></div>
        <div class="field"><label>分类</label><input id="pm_category" list="catList" placeholder="如 沙发"><datalist id="catList"></datalist></div>
      </div>
      <div class="row2">
        <div class="field"><label>型号</label><input id="pm_model" placeholder="如 KY-1001"></div>
        <div class="field"><label>一口价 *（元）</label><input id="pm_price" inputmode="numeric" placeholder="如 2580"></div>
      </div>
      <div class="field"><label>规格</label><input id="pm_spec" placeholder="如 3人位 + 贵妃位"></div>
      <div class="field"><label>外径尺寸</label><input id="pm_dimensions" placeholder="如 长280 × 深90 × 高85 cm"></div>
      <div class="field"><label>材质</label><input id="pm_material" placeholder="如 科技布 + 高密度海绵 + 实木框架"></div>
      <div class="field"><label>产品图片（可传多张，第一张为封面）</label>
        <div id="pm_imgs" class="img-list"></div>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
          <button class="btn small" id="btnUpload">＋ 上传图片</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
          <input id="pm_imgurl" placeholder="粘贴图片链接" style="flex:1;min-width:140px">
          <button class="btn small" id="btnAddUrl">添加链接</button>
        </div>
      </div>
      <div class="field" style="display:flex;gap:16px">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pm_featured"> 推荐置顶</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="pm_onSale" checked> 在售</label>
      </div>
      <button class="btn primary" style="width:100%" id="pmSave">保存产品</button>
    </div>
  </div>

  <div class="modal" id="batchModal">
    <div class="modal-panel">
      <div class="modal-head"><h2>批量添加产品</h2><button class="x" id="batchClose">×</button></div>
      <div class="field"><label>每行一个产品，字段用竖线 | 分隔，顺序：名称 | 分类 | 型号 | 规格 | 尺寸 | 材质 | 价格 | 图片链接</label>
        <textarea id="batchText" rows="11" placeholder="例：&#10;实木床 1.8米 | 实木床 | KY-2001 | 1.8m×2.0m | 190×210cm | 泰国橡木 | 1680 | https://...jpg&#10;软包床 1.5米 | 软体床 | KY-2002 | 1.5m×1.9m | 160×200cm | 实木+海绵 | 1380 |"></textarea>
      </div>
      <div class="muted" style="margin:-6px 0 14px">可从 Excel 复制后粘贴，列之间会自动按制表符识别；图片可先留空，稍后再补。</div>
      <button class="btn primary" style="width:100%" id="batchSubmit">开始添加</button>
    </div>
  </div>

  <div class="cropbox" id="cropbox">
    <div class="crop-top">
      <button class="btn small" id="cropCancel">取消</button>
      <button class="btn small" id="cropAuto">自动裁剪</button>
      <div class="crop-title">可拖动微调</div>
      <button class="btn small primary" id="cropSave">保存裁剪</button>
    </div>
    <div class="crop-stage" id="cropStage"><div class="crop-holder" id="cropHolder"><img id="cropImg" src="" alt=""><div class="crop-sel" id="cropSel" style="display:none"></div></div></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lb-close" id="lbClose" title="关闭">×</div>
    <div class="lb-tools">
      <button class="lb-btn" id="lbZoomOut" title="缩小">−</button>
      <button class="lb-btn" id="lbZoomIn" title="放大">＋</button>
      <button class="lb-btn" id="lbReset" title="复位">1:1</button>
      <button class="lb-btn" id="lbCrop" title="裁剪">裁剪</button>
    </div>
    <div class="lb-wrap" id="lbWrap"><div class="lb-inner"><img id="lbImg" src="" alt=""></div></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/sortable.min.js?v=20260925n"></script>
  <script src="/js/admin.js?v=20260925n"></script>
</body>
</html>
